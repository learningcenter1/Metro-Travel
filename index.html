<script id="gh-sync-js">
(function(){

  var K={cfg:'metro_gh_cfg', base:'metro_gh_base', dirty:'metro_gh_dirty', skip:'metro_gh_skip'};

    var p=preset(); c=c||{}; ['owner','repo','branch','path'].forEach(function(k){ if(p[k]) c[k]=p[k]; });
    c.branch=c.branch||'main'; c.path=c.path||'data.json';

<!-- ===== UI patch: slim icon ribbon / Menu button + bigger text (added) ===== -->
<style id="ux-patch-css">
  :root{ --ux-scale:125%; --sbw:3.5rem; }
  html{ font-size:var(--ux-scale) !important; }
  [class*="text-[10px]"],[class*="text-[11px]"]{ font-size:.8rem !important; line-height:1.25 !important; }
  aside nav, aside nav *{ font-size:.875rem; }
  header button.lg\:hidden{ display:none !important; }

  /* ---------- FULL menu ---------- */
  body.ux-open{ --sbw:14.5rem; }
  body.ux-open aside{ transform:none !important; translate:none !important; display:flex !important; width:14.5rem !important; }
  /* sidebar stays on screen and its own list scrolls (so the scroll bar is there) */
  @media (min-width:1024px){ body.ux-open aside{ position:sticky !important; top:0 !important; align-self:flex-start !important; height:100vh !important; height:100dvh !important; } }
  body.ux-rail aside, body.ux-open aside{ max-height:100vh; }
  aside nav{ min-height:0; }
  /* ---------- hidden (phone default) ---------- */
  body.ux-closed{ --sbw:0px; }
  body.ux-closed aside{ display:none !important; }
  @media (max-width:1023px){ body.ux-open aside{ position:fixed !important; box-shadow:0 0 40px rgba(0,0,0,.45); } }

  /* ---------- slim ICON RIBBON (desktop default); hover to read the names ---------- */
  body.ux-rail{ --sbw:3.5rem; }
  body.ux-rail aside{ position:fixed !important; inset:0 auto 0 0 !important; transform:none !important; translate:none !important; display:flex !important;
                      width:3.5rem !important; overflow:hidden; z-index:45; transition:width .15s ease; }
  body.ux-rail aside + div{ margin-left:3.5rem; }
  body.ux-rail aside:hover{ width:14.5rem !important; box-shadow:0 0 30px rgba(0,0,0,.45); }
  body.ux-rail aside:not(:hover) > div:first-child{ padding:.6rem .35rem !important; justify-content:center; }
  body.ux-rail aside:not(:hover) > div:first-child button.lg\:hidden,
  body.ux-rail aside:not(:hover) > div:first-child > button + button{ display:none !important; }
  body.ux-rail aside:not(:hover) > div:first-child button > div > div:not(:first-child){ display:none !important; }
  body.ux-rail aside:not(:hover) nav{ padding-left:.3rem; padding-right:.3rem; overflow-x:hidden; }
  body.ux-rail aside:not(:hover) nav button{ justify-content:center !important; padding-left:0 !important; padding-right:0 !important; }
  body.ux-rail aside:not(:hover) nav button > span{ display:none !important; }
  body.ux-rail aside:not(:hover) nav button > svg:not(.lucide-chevron-down){ width:1.35rem !important; height:1.35rem !important; opacity:1 !important; }
  body.ux-rail aside:not(:hover) nav button > svg.lucide-chevron-down{ width:1rem !important; height:1rem !important; }
  body.ux-rail aside:not(:hover) nav div.pl-2{ padding-left:0 !important; }
  body.ux-rail aside:not(:hover) nav > div.pt-2{ border-top:1px solid rgba(148,163,184,.25); margin-top:.35rem; }
  body.ux-rail aside:not(:hover) > div:last-child{ padding:.5rem 0 !important; justify-content:center; }
  body.ux-rail aside:not(:hover) > div:last-child button{ font-size:0 !important; justify-content:center; }
  body.ux-rail aside:not(:hover) > div:last-child button svg{ width:1.3rem; height:1.3rem; }
  body.ux-rail aside:not(:hover) > div:last-child span{ display:none; }

  body.ux-rail:has(aside:hover) #ux-menu-btn{ left:calc(14.5rem + .6rem); }
  /* ---------- clearly visible scrollbars (drag handle) ---------- */
  ::-webkit-scrollbar{ width:16px; height:16px; }
  ::-webkit-scrollbar-track{ background:#e2e8f0; }
  ::-webkit-scrollbar-thumb{ background:#475569; border-radius:8px; border:3px solid #e2e8f0; min-height:3rem; }
  ::-webkit-scrollbar-thumb:hover{ background:#1e293b; }
  aside nav::-webkit-scrollbar{ width:16px; }
  aside nav::-webkit-scrollbar-track{ background:#1e293b; }
  aside nav::-webkit-scrollbar-thumb{ background:#f59e0b; border-radius:8px; border:3px solid #1e293b; min-height:3rem; }
  aside nav::-webkit-scrollbar-thumb:hover{ background:#fbbf24; }
  body.ux-rail aside:not(:hover) nav::-webkit-scrollbar{ width:12px; }
  @supports (-moz-appearance:none){ aside nav{ scrollbar-width:auto; scrollbar-color:#f59e0b #1e293b; } html{ scrollbar-width:auto; scrollbar-color:#475569 #e2e8f0; } }
  aside nav{ overflow-y:scroll !important; }
  /* ---------- Menu button ---------- */
  body header{ padding-left:4.4rem !important; }
  #ux-menu-btn{
    position:fixed; top:.55rem; left:calc(var(--sbw) + .6rem); z-index:60; height:2.6rem; padding:0 .8rem;
    display:flex; align-items:center; gap:.45rem; border:0; border-radius:.6rem; cursor:pointer;
    background:#f59e0b; color:#0B192C; font:700 .9rem 'Segoe UI',Arial,sans-serif; box-shadow:0 2px 8px rgba(0,0,0,.28); transition:left .15s ease;
  }
  #ux-menu-btn:hover{ background:#fbbf24; }
  #ux-menu-btn svg{ width:1.3rem; height:1.3rem; }
  #ux-menu-btn .ux-lbl{ display:none; }
  @media (min-width:640px){ #ux-menu-btn .ux-lbl{ display:inline; } body header{ padding-left:7rem !important; } }
  #ux-scrim{ display:none; position:fixed; inset:0; background:rgba(2,6,23,.5); z-index:30; }
  @media (max-width:1023px){ body.ux-open #ux-scrim{ display:block; } }
  #ux-font{ position:fixed; right:.8rem; bottom:.8rem; z-index:60; display:flex; align-items:center; gap:.15rem; background:#0B192C; color:#fff; border-radius:.6rem; padding:.2rem; box-shadow:0 2px 10px rgba(0,0,0,.35); opacity:.92; font:600 .8rem 'Segoe UI',Arial,sans-serif; }
  #ux-font button{ border:0; background:#1e3a5f; color:#fff; width:2.1rem; height:2.1rem; border-radius:.45rem; font:700 1rem 'Segoe UI',Arial,sans-serif; cursor:pointer; }
  #ux-font button:hover{ background:#2f5c96; }
  #ux-font span{ padding:0 .45rem; min-width:2.6rem; text-align:center; }
  @media print{ #ux-menu-btn,#ux-font,#ux-scrim{ display:none !important; } html{ font-size:100% !important; } body.ux-rail aside + div{ margin-left:0; } }
</style>
<script id="ux-patch-js">
(function(){
  if(window.__uxPatch) return; window.__uxPatch = true;
  var SIZES=[100,112.5,125,137.5,150,175], KEY_S='metro_ui_scale', KEY_M='metro_ui_menu2';
  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  var scale = parseFloat(get(KEY_S)); if(SIZES.indexOf(scale)<0) scale = 125;
  function applyScale(){ document.documentElement.style.setProperty('--ux-scale', scale+'%'); var l=document.getElementById('ux-font-val'); if(l) l.textContent = Math.round(scale)+'%'; }
  function bump(d){ var i=SIZES.indexOf(scale)+d; i=Math.max(0,Math.min(SIZES.length-1,i)); scale=SIZES[i]; set(KEY_S,String(scale)); applyScale(); }
  var desktop = function(){ return window.innerWidth>=1024; };
  var pref = get(KEY_M);                       // 'full' | 'rail' | null (= ribbon on desktop)
  var cls = ['ux-open','ux-rail','ux-closed'];
  function mode(){ return document.body.classList.contains('ux-open') ? 'open' : document.body.classList.contains('ux-rail') ? 'rail' : 'closed'; }
  function setMode(m){
    cls.forEach(function(c){ document.body.classList.remove(c); }); document.body.classList.add('ux-'+m);
    var b=document.getElementById('ux-menu-btn'); if(b) b.title = (m==='open' ? (desktop()?'Shrink menu to icons':'Hide menu') : 'Show full menu')+'  (Ctrl+B)';
  }
  function auto(){ setMode(desktop() ? (pref==='full' ? 'open' : 'rail') : 'closed'); }
  function toggle(){
    var m = mode();
    if(desktop()){ pref = (m==='open') ? 'rail' : 'full'; set(KEY_M, pref); setMode(m==='open' ? 'rail' : 'open'); }
    else setMode(m==='open' ? 'closed' : 'open');
  }
  /* hover tooltips for the icon ribbon */
  function tip(){
    document.querySelectorAll('aside nav button').forEach(function(b){ if(b.title) return; var s=b.querySelector('span'); if(s && s.textContent.trim()) b.title = s.textContent.trim(); });
    var lk=document.querySelector('aside > div:last-child button'); if(lk && !lk.title) lk.title='Start / Lock Screen';
  }
  function build(){
    if(document.getElementById('ux-menu-btn')) return;
    var b=document.createElement('button'); b.id='ux-menu-btn'; b.type='button';
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="ux-lbl">Menu</span>';
    b.onclick=toggle;
    var s=document.createElement('div'); s.id='ux-scrim'; s.onclick=function(){ setMode('closed'); };
    var f=document.createElement('div'); f.id='ux-font';
    f.innerHTML='<button type="button" title="Smaller text" id="ux-f-m">A−</button><span id="ux-font-val"></span><button type="button" title="Bigger text" id="ux-f-p">A+</button>';
    document.body.appendChild(s); document.body.appendChild(b); document.body.appendChild(f);
    document.getElementById('ux-f-m').onclick=function(){ bump(-1); };
    document.getElementById('ux-f-p').onclick=function(){ bump(1); };
    applyScale(); auto(); tip();
    new MutationObserver(function(){ clearTimeout(window.__uxT); window.__uxT=setTimeout(tip,150); }).observe(document.getElementById('root'), {childList:true, subtree:true});
  }
  document.addEventListener('click', function(e){      /* phone: close the menu after choosing a page */
    if(desktop() || mode()!=='open') return;
    if(!(e.target.closest && e.target.closest('aside'))) return;
    var h=function(){ var t=document.querySelector('main'); return t? t.innerText.slice(0,400) : ''; }, before=h();
    setTimeout(function(){ if(h()!==before) setMode('closed'); }, 200);
  }, true);
  document.addEventListener('keydown', function(e){ if((e.ctrlKey||e.metaKey) && (e.key==='b'||e.key==='B')){ e.preventDefault(); toggle(); } });
  window.addEventListener('resize', auto);
  window.showUpdateReady=function(){
    if(document.getElementById('upd-bar')) return; var d=document.createElement('div'); d.id='upd-bar';
    d.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:4.2rem;z-index:99996;background:#0B192C;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);font:600 14px Segoe UI,Arial,sans-serif;display:flex;gap:12px;align-items:center';
    d.innerHTML='🔄 A new version of the program is ready. Your data is not affected. <button style="border:0;border-radius:7px;padding:6px 12px;font-weight:700;cursor:pointer" onclick="location.reload()">Reload now</button><button style="border:1px solid #fff8;background:transparent;color:#fff;border-radius:7px;padding:6px 10px;cursor:pointer" onclick="this.parentNode.remove()">Later</button>'; document.body.appendChild(d); };
  applyScale();
  if(document.body) build(); else document.addEventListener('DOMContentLoaded', build);
})();
</script>
